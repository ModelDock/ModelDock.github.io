<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Vignette Filter -->
    <radialGradient id="omni-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#05060a" stop-opacity="1" />
    </radialGradient>

    <!-- Neon Cyan to Indigo Gradient -->
    <linearGradient id="neon-cyan-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Violet to Fuchsia Gradient -->
    <linearGradient id="neon-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="60%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Inner Core Glow Gradient -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00f2fe" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#05060a" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-core" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Prism Background Base -->
  <rect width="128" height="128" rx="28" fill="#07090e" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="url(#omni-bg)" stroke="url(#neon-cyan-indigo)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Ambient Energy Glow in Center -->
  <circle cx="64" cy="64" r="38" fill="url(#core-glow)" filter="url(#glow-core)" opacity="0.65" />

  <!-- Outer Isometric Neural Hex-Prism Top Facet -->
  <polygon points="64,24 96,42 64,60 32,42" fill="url(#neon-cyan-indigo)" fill-opacity="0.25" stroke="#00f2fe" stroke-width="2" stroke-linejoin="round" filter="url(#glow-cyan)" />

  <!-- Left Facet -->
  <polygon points="32,42 64,60 64,96 32,78" fill="url(#neon-purple)" fill-opacity="0.35" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" />

  <!-- Right Facet -->
  <polygon points="64,60 96,42 96,78 64,96" fill="url(#neon-cyan-indigo)" fill-opacity="0.45" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />

  <!-- Quantum Neural Core - Center Floating Diamond -->
  <polygon points="64,48 76,64 64,80 52,64" fill="#ffffff" fill-opacity="0.9" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow-cyan)" />

  <!-- Orbital Energy Rings -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#neon-cyan-indigo)" stroke-width="1.4" stroke-dasharray="8 6" opacity="0.75" transform="rotate(-24 64 64)" />
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#neon-purple)" stroke-width="1.4" stroke-dasharray="8 6" opacity="0.65" transform="rotate(24 64 64)" />

  <!-- Quantum Energy Nodes -->
  <circle cx="64" cy="24" r="3" fill="#00f2fe" filter="url(#glow-cyan)" />
  <circle cx="96" cy="42" r="2.5" fill="#38bdf8" />
  <circle cx="96" cy="78" r="2.5" fill="#818cf8" />
  <circle cx="64" cy="96" r="3" fill="#6366f1" filter="url(#glow-cyan)" />
  <circle cx="32" cy="78" r="2.5" fill="#a855f7" />
  <circle cx="32" cy="42" r="2.5" fill="#00f2fe" />
</svg>
